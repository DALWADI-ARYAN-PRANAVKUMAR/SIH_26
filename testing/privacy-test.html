<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Test - Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .liquid-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); color: white; transition: all 0.3s ease; }
        .liquid-input:focus { border-color: rgba(34, 211, 238, 0.4); background: rgba(0, 0, 0, 0.3); outline: none; box-shadow: 0 0 15px rgba(34, 211, 238, 0.1); }
    </style>
</head>
<body class="bg-slate-950 min-h-screen p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-cyan-950 to-slate-950 text-slate-200 relative overflow-x-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-600/10 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-fuchsia-600/10 blur-[120px] pointer-events-none z-0"></div>

    <a href="index.html" class="fixed top-6 left-6 z-50 liquid-glass px-5 py-2.5 rounded-full font-medium text-sm text-white hover:bg-white/10 transition-all flex items-center gap-2 hover:-translate-x-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to Hub
    </a>

    <div class="max-w-6xl mx-auto pt-16 relative z-10">
        <div class="liquid-glass rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-cyan-400 font-semibold text-sm tracking-wide uppercase"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Try Asking</div>
            <div class="flex flex-wrap gap-2">
                <span class="bg-black/30 border border-white/10 px-3 py-1 rounded-lg text-xs font-mono text-cyan-100/70">"What is my password?"</span>
                <span class="bg-black/30 border border-white/10 px-3 py-1 rounded-lg text-xs font-mono text-cyan-100/70">"Read my Aadhaar"</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="liquid-glass rounded-3xl p-10 border-t-[4px] border-t-cyan-500/50 lg:col-span-2">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-white/10 pb-6">
                    <div>
                        <h1 class="text-3xl font-light tracking-tight text-white mb-2">Privacy Redaction</h1>
                        <p class="text-slate-400 text-sm font-light">Test the on-device privacy firewall.</p>
                    </div>
                    <div class="flex gap-2 mt-4 md:mt-0">
                        <button class="liquid-glass px-4 py-2 rounded-lg text-xs font-medium text-white hover:bg-white/10">Demo Data</button>
                        <button class="liquid-glass px-4 py-2 rounded-lg text-xs font-medium text-white hover:bg-white/10">Clear</button>
                    </div>
                </div>

                <form class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest">Name</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest">Email</label><input type="email" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest">Phone</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">Password</label><input type="password" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">OTP</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">Aadhaar</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">PAN</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">Credit Card</label><input type="text" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                    <div class="space-y-1.5 md:col-span-2"><label class="block text-[11px] font-medium text-slate-400 uppercase tracking-widest text-cyan-400">API Key</label><input type="password" class="w-full liquid-input rounded-xl p-3 text-sm"></div>
                </form>
            </div>

            <div class="space-y-6">
                <div class="liquid-glass rounded-3xl p-8">
                    <h3 class="text-lg font-light text-white mb-4 border-b border-white/10 pb-4">Live Activity</h3>
                    <div class="space-y-3 font-mono text-[10px] text-slate-400">
                        <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-cyan-400"></span> System Idle...</div>
                        <div class="flex items-center gap-2 opacity-50"><span class="w-2 h-2 rounded-full bg-slate-600"></span> Firewall Active</div>
                        <div class="flex items-center gap-2 opacity-50"><span class="w-2 h-2 rounded-full bg-slate-600"></span> Vision Engine Ready</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
