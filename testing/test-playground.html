<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Playground - Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .liquid-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); color: white; transition: all 0.3s ease; }
        .liquid-input:focus { border-color: rgba(34, 211, 238, 0.4); background: rgba(0, 0, 0, 0.3); outline: none; box-shadow: 0 0 15px rgba(34, 211, 238, 0.1); }
        option { background: #0f172a; color: white; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-cyan-950 to-slate-950 text-slate-200 relative overflow-x-hidden">
    
    <!-- Unified Hub Theme Glows -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-600/10 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-fuchsia-600/10 blur-[120px] pointer-events-none z-0"></div>

    <a href="index.html" class="fixed top-6 left-6 z-50 liquid-glass px-5 py-2.5 rounded-full font-medium text-sm text-white hover:bg-white/10 transition-all flex items-center gap-2 hover:-translate-x-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to Hub
    </a>

    <div class="max-w-2xl mx-auto pt-16 relative z-10">
        <!-- Sleek Command Banner -->
        <div class="liquid-glass rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-cyan-500/20">
            <div class="flex items-center gap-2 text-cyan-400 font-semibold text-sm tracking-wide uppercase">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Try Asking
            </div>
            <div class="flex flex-wrap gap-2">
                <span class="bg-black/30 border border-white/10 px-3 py-1.5 rounded-lg text-xs font-mono text-cyan-100/70">"Fill out flight search"</span>
                <span class="bg-black/30 border border-white/10 px-3 py-1.5 rounded-lg text-xs font-mono text-cyan-100/70">"Set route to JFK"</span>
            </div>
        </div>

        <!-- Flight Form -->
        <div class="liquid-glass rounded-3xl p-10 border-t-[4px] border-t-cyan-500/50 mb-8">
            <div class="mb-8 border-b border-white/10 pb-6 text-center">
                <h1 class="text-3xl font-light tracking-tight text-white mb-2">Flight Search</h1>
                <p class="text-slate-400 text-sm font-light">Legacy playground for basic action testing.</p>
            </div>
            
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-widest">Passenger Name</label>
                    <input type="text" id="name" class="w-full liquid-input rounded-xl p-3.5" placeholder="Enter passenger name">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-widest">Origin City (From)</label>
                        <input type="text" id="origin" class="w-full liquid-input rounded-xl p-3.5" placeholder="e.g., SFO">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-widest">Destination City (To)</label>
                        <input type="text" id="destination" class="w-full liquid-input rounded-xl p-3.5" placeholder="e.g., JFK">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-widest">Country</label>
                        <select id="country" class="w-full liquid-input rounded-xl p-3.5">
                            <option value="">Select country...</option>
                            <option value="in">India</option>
                            <option value="us">United States</option>
                            <option value="uk">United Kingdom</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-widest">Password (Test)</label>
                        <input type="password" id="pwd" class="w-full liquid-input rounded-xl p-3.5" placeholder="Enter test password">
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-2 pb-2">
                    <input type="checkbox" id="subscribe" class="w-5 h-5 rounded border-white/20 bg-black/30 text-cyan-500 focus:ring-cyan-500/50">
                    <label for="subscribe" class="text-sm font-medium text-slate-300">Subscribe to newsletter</label>
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" class="flex-1 liquid-glass hover:bg-white/10 text-cyan-400 font-medium tracking-wide py-4 rounded-xl transition-all border-cyan-500/30">
                        Search Flights
                    </button>
                    <button type="button" disabled class="flex-1 liquid-glass opacity-50 cursor-not-allowed text-slate-400 font-medium tracking-wide py-4 rounded-xl transition-all border-white/5 bg-black/20">
                        Submit (Disabled)
                    </button>
                </div>
            </div>
        </div>

        <div class="liquid-glass rounded-3xl p-10 mb-8 border-t-[4px] border-t-fuchsia-500/50">
            <h1 class="text-xl font-light tracking-tight text-white mb-2">Content Navigation</h1>
            <p class="text-slate-400 text-sm font-light mb-6">Use these links to test navigation actions.</p>
            <div class="flex gap-4">
                <a href="#home" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">Home</a>
                <a href="#products" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">Products</a>
                <a href="#contact" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">Contact</a>
            </div>
        </div>

        <div class="liquid-glass rounded-3xl p-10 h-[800px] flex items-center justify-center border-dashed border-white/20 mb-8">
            <p class="text-slate-500 font-light tracking-widest uppercase">Scroll Area</p>
        </div>
    </div>
</body>
</html>
